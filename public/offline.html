<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hors ligne - Ilands Solutions</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 flex items-center justify-center min-h-screen">

  <div class="text-center max-w-md px-6">

    <!-- Icon -->
    <div class="flex justify-center mb-6">
      <div class="bg-emerald-100 p-4 rounded-full">
        <svg class="w-10 h-10 text-emerald-600" fill="none" stroke="currentColor"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 4v8m0 0l-3-3m3 3l3-3m-6 9h6" />
        </svg>
      </div>
    </div>

    <!-- Title -->
    <h1 class="text-2xl font-bold text-gray-900">
      Vous êtes hors ligne
    </h1>

    <!-- Subtitle -->
    <p class="mt-3 text-gray-600 text-sm leading-relaxed">
      Ilands Solutions n’arrive pas à se connecter à Internet.
      Vérifiez votre connexion et réessayez.
    </p>

    <!-- Actions -->
    <div class="mt-6 flex flex-col gap-3">

      <button onclick="location.reload()"
        class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-3 rounded-xl transition">
        Réessayer
      </button>

      <a href="/"
        class="text-sm text-gray-500 hover:text-gray-700 transition">
        Retour à l’accueil
      </a>

    </div>

    <!-- Status indicator -->
    <div class="mt-8 flex items-center justify-center gap-2 text-xs text-gray-400">
      <span class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></span>
      Connexion indisponible
    </div>

  </div>

</body>
</html>
